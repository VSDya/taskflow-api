name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate Docker Compose config
        env:
          POSTGRES_PASSWORD: ci-test-password
          JWT_SECRET: ci-only-test-signing-key-0123456789abcdef
        run: docker compose config --quiet

      - name: Verify
        run: mvn -B verify

      - name: Package
        run: mvn -B package -DskipTests

      - name: Start application stack
        env:
          POSTGRES_PASSWORD: ci-test-password
          JWT_SECRET: ci-only-test-signing-key-0123456789abcdef
        run: docker compose up --build -d

      - name: Smoke test health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health; then
              echo
              echo "Health endpoint responded successfully."
              exit 0
            fi

            echo "Waiting for application to become healthy (attempt ${attempt}/30)..."
            sleep 5
          done

          echo "Health endpoint did not become available in time."
          exit 1

      - name: Show container logs on failure
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-test-password
          JWT_SECRET: ci-only-test-signing-key-0123456789abcdef
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-test-password
          JWT_SECRET: ci-only-test-signing-key-0123456789abcdef
        run: docker compose down
