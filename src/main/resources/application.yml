spring:
  application:
    name: taskflow-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:taskflow}
    username: ${POSTGRES_USER:taskflow}
    password: ${POSTGRES_PASSWORD:change_me}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change_me_to_a_long_random_secret_key_at_least_32_chars}
  expiration-ms: 3600000
